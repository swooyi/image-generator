<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puzzle Image Generators</title>
    <link rel="stylesheet" href="./src/home.css" />
  </head>
  <body>
    <main class="home-shell">
      <header class="home-header">
        <p class="eyebrow">PUZZLE IMAGE TOOLS</p>
        <h1>이미지 생성기 선택</h1>
        <p>만들려는 퍼즐 이미지를 선택하세요.</p>
      </header>

      <section class="generator-grid" aria-label="이미지 생성기 목록">
        <a class="generator-card fto-card" href="./image-gen-fto.html">
          <img class="puzzle-mark fto-mark" src="./src/assets/fto-icon.svg" alt="" aria-hidden="true" />
          <div>
            <p class="card-kicker">FTO</p>
            <h2>FTO 이미지 · 시뮬레이터</h2>
            <p>입력과 커스터마이징을 유지하며 한 개 생성·여러 개 생성·3D 시뮬레이터를 전환합니다.</p>
          </div>
          <span class="card-action">열기 <b aria-hidden="true">→</b></span>
        </a>

        <a class="generator-card cube-card" href="./image-gen-3x3.html">
          <div class="puzzle-mark cube-mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div>
            <p class="card-kicker">NxNxN</p>
            <h2>NxNxN 이미지 · 시뮬레이터</h2>
            <p>3D·LL 뷰, 공식 적용, 색상 편집과 단일·여러 이미지 저장을 지원합니다.</p>
          </div>
          <span class="card-action">열기 <b aria-hidden="true">→</b></span>
        </a>
      </section>
    </main>
  </body>
</html>
